<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Internal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: '#161724', background: '#F4F5FB' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
</head>

<body class="bg-background font-sans antialiased h-screen flex items-center justify-center p-4">

  <div
    class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.06)] flex flex-col md:flex-row w-full max-w-4xl overflow-hidden min-h-[550px] transform transition-all duration-500 hover:shadow-[0_20px_50px_rgb(0,0,0,0.08)]">

    <!-- Bagian Kiri (Branding) -->
    <div
      class="bg-brand md:w-5/12 p-10 flex flex-col justify-between text-white hidden md:flex relative overflow-hidden">
      <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-blue-600/10 rounded-full blur-2xl"></div>
      <div class="relative z-10">
        <h1 class="text-3xl font-bold tracking-tight">INTERNAL SYSTEM</h1>
        <p class="text-gray-400 text-sm mt-1">Seksi Desain Promosi</p>
      </div>
      <div class="relative z-10">
        <h2 class="text-2xl font-semibold mb-3">Portal Operasional</h2>
        <p class="text-gray-400 text-sm leading-relaxed">Sistem terintegrasi untuk manajemen workflow, monitoring tugas,
          dan evaluasi hasil kerja tim.</p>
      </div>
    </div>

    <!-- Bagian Kanan (Form Login) -->
    <div class="w-full md:w-7/12 p-8 md:p-12 flex flex-col justify-center transition-all duration-300">

      <h3 class="text-2xl font-bold text-gray-800 mb-2">Sign In</h3>
      <p class="text-sm text-gray-500 mb-8">Masukkan username dan password Anda untuk masuk ke sistem.</p>

      <div id="error-message"
        class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-200 mb-4 transition-all">
      </div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input type="text" id="username" required autocomplete="off" autocapitalize="off" spellcheck="false"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand outline-none transition-all duration-200"
            placeholder="Masukkan username Anda">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="password" required
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand outline-none transition-all duration-200"
            placeholder="Masukkan password">
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-brand hover:bg-gray-800 text-white font-medium py-3 px-4 rounded-xl transition-all duration-200 shadow-lg shadow-gray-900/10 active:scale-[0.98] mt-4">
          <span id="btn-text">Sign In</span>
        </button>
      </form>

      <p class="mt-6 text-center text-xs text-gray-400">
        Belum punya akun? Hubungi developer/admin sistem untuk dibuatkan akun.
      </p>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ybedibzzdbudwitiriso.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliZWRpYnp6ZGJ1ZHdpdGlyaXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NTM5MjksImV4cCI6MjEwMzUyOTkyOX0.A3qxv3K3qSyBz87OY5PnVYJLU8k1a0qvWYJja7sucpg';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const NAMA_TABEL = 'User';

    const form = document.getElementById('auth-form');
    const btnText = document.getElementById('btn-text');
    const errorBox = document.getElementById('error-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      btnText.innerText = 'Memproses...';

      // Username diambil apa adanya (tanpa mengubah huruf besar/kecil) supaya
      // pencocokan ke database bersifat case-sensitive: "Admin" dan "admin" dianggap berbeda.
      const inputUsername = document.getElementById('username').value.trim();
      const inputPassword = document.getElementById('password').value;

      const { data, error } = await db
        .from(NAMA_TABEL)
        .select('*')
        .eq('nama_user', inputUsername)
        .eq('password', inputPassword);

      if (error) {
        errorBox.innerText = 'Terjadi kesalahan sistem: ' + error.message;
        errorBox.classList.remove('hidden');
      } else if (data && data.length > 0) {
        const userData = data[0];
        localStorage.setItem('data_user', JSON.stringify(userData));

        const userRole = (userData.role || 'editor').toLowerCase();
        if (userRole === 'cabang') {
          window.location.href = 'cabang-dashboard.html';
        } else if (userRole === 'editor') {
          window.location.href = 'editor-dashboard.html';
        } else {
          window.location.href = 'admin-dashboard.html';
        }
      } else {
        errorBox.innerText = 'Login gagal: username atau password salah.';
        errorBox.classList.remove('hidden');
      }

      btnText.innerText = 'Sign In';
    });
  </script>
</body>

</html>
